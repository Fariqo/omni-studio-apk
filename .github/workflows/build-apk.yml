name: Omni-Apex APK Factory
on:
  workflow_dispatch:
    inputs:
      app_name:
        default: 'OmniApexStudio'
      app_id:
        default: 'com.fariqo.omniapex'
permissions:
  contents: write
jobs:
  build-native-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Capacitor Kurulumu
        run: |
          rm -rf package.json package-lock.json node_modules android
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/camera @capacitor/geolocation @capacitor/filesystem @capacitor/local-notifications @capacitor/share @capacitor/device @capacitor/network
          npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.app_id }}" --web-dir dist
          mkdir -p dist
          cp index.html dist/index.html || true
          npx cap add android
      - name: Izinleri Ekle ve APK Derle
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.CAMERA"\/><uses-permission android:name="android.permission.RECORD_AUDIO"\/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/><uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"\/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/><\/manifest>/g' "$MANIFEST"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "APK v1.0.${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
